<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙级浪漫 - Universe of Love</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a1a2a 100%);
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
}

#stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

.shooting-star {
  position: fixed;
  width: 100px;
  height: 1px;
  background: linear-gradient(90deg, #fff, transparent);
  animation: shoot 3s ease-in-out infinite;
  z-index: 1;
  pointer-events: none;
}
@keyframes shoot {
  0% { transform: translate(0, 0); opacity: 1; }
  100% { transform: translate(-300px, 300px); opacity: 0; }
}

#userScreen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(10px);
}
.user-card {
  background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 30px; padding: 50px 60px; text-align: center; backdrop-filter: blur(10px);
  animation: fadeInUp 0.8s ease;
}
@keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.user-card h1 {
  font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 10px;
  background: linear-gradient(45deg, #ff6b9d, #c44569, #ff6b9d); background-size: 200% 200%;
  animation: gradientMove 3s ease infinite; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
@keyframes gradientMove { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
.user-card p { color: rgba(255, 255, 255, 0.5); margin-bottom: 40px; font-size: 1.1rem; }
.user-btns { display: flex; gap: 20px; justify-content: center; }
.user-btn {
  padding: 15px 50px; border: none; border-radius: 50px; font-size: 1.2rem; cursor: pointer;
  transition: all 0.3s ease; font-family: 'Noto Sans SC', sans-serif;
}
.user-btn.boy { background: linear-gradient(45deg, #4facfe, #00f2fe); color: #fff; }
.user-btn.girl { background: linear-gradient(45deg, #ff6b9d, #c44569); color: #fff; }
.user-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }

#app {
  display: none; position: relative; z-index: 2; max-width: 800px; margin: 0 auto; padding: 20px;
}

.days-header { text-align: center; padding: 30px 0; animation: fadeIn 0.5s ease; }
.days-display {
  font-size: 4rem; font-weight: 700; font-family: 'Playfair Display', serif;
  background: linear-gradient(45deg, #ff6b9d, #c44569); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.days-label { font-size: 1.2rem; color: rgba(255, 255, 255, 0.5); margin-top: 5px; }
.anniversary-date { font-size: 0.9rem; color: rgba(255, 255, 255, 0.4); margin-top: 10px; }

.nav-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
.nav-btn {
  padding: 10px 25px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px;
  background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.6); cursor: pointer;
  transition: all 0.3s ease; font-family: 'Noto Sans SC', sans-serif; font-size: 0.95rem;
}
.nav-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
.nav-btn.active { background: linear-gradient(45deg, #ff6b9d, #c44569); color: #fff; border-color: transparent; }

.card {
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px; padding: 25px; margin-bottom: 20px; backdrop-filter: blur(5px);
  animation: fadeInUp 0.5s ease; transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 40px rgba(255, 107, 157, 0.1); }
.card-title { font-size: 1.1rem; font-weight: 500; margin-bottom: 15px; color: rgba(255, 255, 255, 0.8); }

.memory-card { position: relative; }
.memory-card .delete-btn {
  position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border: none; border-radius: 50%;
  background: rgba(255, 107, 157, 0.2); color: #ff6b9d; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
}
.memory-card .delete-btn:hover { background: #ff6b9d; color: #fff; }
.memory-card .edit-btn {
  position: absolute; top: 10px; right: 50px; width: 28px; height: 28px; border: none; border-radius: 50%;
  background: rgba(79, 172, 254, 0.2); color: #4facfe; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
}
.memory-card .edit-btn:hover { background: #4facfe; color: #fff; }
.memory-title { font-size: 1.3rem; font-weight: 500; margin-bottom: 10px; color: #ff6b9d; }
.memory-text { font-size: 1rem; line-height: 1.8; color: rgba(255, 255, 255, 0.8); margin-bottom: 10px; }
.memory-photo { max-width: 100%; border-radius: 10px; margin-top: 10px; }
.memory-score { display: inline-block; padding: 4px 12px; border-radius: 15px; font-size: 0.8rem; margin-top: 8px; }
.memory-score.high { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
.memory-score.mid { background: rgba(255, 165, 0, 0.2); color: #ffa500; }
.memory-score.low { background: rgba(128, 128, 128, 0.2); color: #888; }
.memory-date { font-size: 0.85rem; color: rgba(255, 255, 255, 0.4); margin-top: 8px; }

.letter-card { border-left: 3px solid; padding-left: 20px; position: relative; }
.letter-card .delete-btn {
  position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border: none; border-radius: 50%;
  background: rgba(255, 107, 157, 0.2); color: #ff6b9d; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
}
.letter-card .delete-btn:hover { background: #ff6b9d; color: #fff; }
.letter-from { font-weight: 500; margin-bottom: 8px; }
.letter-msg { font-size: 1rem; line-height: 1.7; color: rgba(255, 255, 255, 0.7); }
.letter-date { font-size: 0.8rem; color: rgba(255, 255, 255, 0.3); margin-top: 8px; }

.thing-card {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 20px; border-radius: 15px; background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 10px; transition: all 0.3s ease;
}
.thing-card:hover { background: rgba(255, 255, 255, 0.05); }
.thing-info { flex: 1; }
.thing-name { font-size: 1rem; margin-bottom: 4px; }
.thing-count { font-size: 0.8rem; color: rgba(255, 255, 255, 0.4); }
.thing-toggle {
  width: 50px; height: 28px; border-radius: 15px; border: none; cursor: pointer; transition: all 0.3s ease; position: relative;
}
.thing-toggle.done { background: linear-gradient(45deg, #ff6b9d, #c44569); }
.thing-toggle.undone { background: rgba(255, 255, 255, 0.1); }
.thing-toggle::after {
  content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%;
  top: 3px; left: 3px; background: #fff; transition: all 0.3s ease;
}
.thing-toggle.done::after { left: 25px; }

.stats-card { text-align: center; margin-bottom: 20px; }
.stats-number {
  font-size: 3rem; font-weight: 700; font-family: 'Playfair Display', serif;
  background: linear-gradient(45deg, #ff6b9d, #c44569); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stats-label { color: rgba(255, 255, 255, 0.5); margin-top: 5px; }
.progress-bar { width: 100%; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); margin-top: 15px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ff6b9d, #c44569); transition: width 0.5s ease; }

.badge-card { text-align: center; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; margin-top: 15px; }
.badge-item {
  text-align: center; padding: 20px 10px; border-radius: 15px;
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s ease;
}
.badge-item.unlocked { border-color: rgba(255, 107, 157, 0.3); background: rgba(255, 107, 157, 0.05); }
.badge-icon { font-size: 2.5rem; margin-bottom: 8px; filter: grayscale(100%); opacity: 0.4; transition: all 0.3s ease; }
.badge-item.unlocked .badge-icon { filter: grayscale(0%); opacity: 1; }
.badge-name { font-size: 0.8rem; color: rgba(255, 255, 255, 0.5); }
.badge-item.unlocked .badge-name { color: #ff6b9d; }

.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.7); z-index: 50; align-items: center; justify-content: center; backdrop-filter: blur(5px);
}
.modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: rgba(20, 20, 40, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px;
  padding: 35px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.4s ease;
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
.modal-title { font-size: 1.4rem; font-weight: 500; }
.modal-close {
  width: 32px; height: 32px; border: none; border-radius: 50%; background: rgba(255, 255, 255, 0.1);
  color: #fff; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;
}
.modal-close:hover { background: rgba(255, 107, 157, 0.3); }

.form-group { margin-bottom: 20px; }
.form-label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: rgba(255, 255, 255, 0.6); }
.form-input, .form-textarea, .form-select {
  width: 100%; padding: 12px 15px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px;
  background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 1rem; font-family: 'Noto Sans SC', sans-serif; transition: all 0.3s ease;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { outline: none; border-color: #ff6b9d; background: rgba(255, 255, 255, 0.08); }
.form-textarea { min-height: 100px; resize: vertical; line-height: 1.6; }
.form-row { display: flex; gap: 15px; }
.form-row .form-group { flex: 1; }

.btn-primary {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  background: linear-gradient(45deg, #ff6b9d, #c44569); color: #fff;
  font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; font-family: 'Noto Sans SC', sans-serif;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3); }
.btn-secondary {
  width: 100%; padding: 14px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
  background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.8); font-size: 1rem; cursor: pointer; transition: all 0.3s ease; font-family: 'Noto Sans SC', sans-serif;
}
.btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

.bottom-actions { display: flex; gap: 10px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
.action-btn {
  padding: 12px 30px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px;
  background: rgba(255, 255, 255, 0.05); color: #fff; cursor: pointer; transition: all 0.3s ease; font-family: 'Noto Sans SC', sans-serif; font-size: 0.95rem;
}
.action-btn:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
.action-btn.primary { background: linear-gradient(45deg, #ff6b9d, #c44569); border-color: transparent; }
.action-btn.primary:hover { box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3); }

#toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  padding: 12px 30px; border-radius: 30px; background: rgba(0, 0, 0, 0.8); color: #fff;
  font-size: 0.95rem; z-index: 1000; transition: all 0.4s ease; pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

.content-section { display: none; animation: fadeIn 0.3s ease; }
.content-section.active { display: block; }

.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
.setting-label { color: rgba(255, 255, 255, 0.7); }
.setting-value { color: #ff6b9d; }

.empty-state { text-align: center; padding: 40px 20px; color: rgba(255, 255, 255, 0.3); }
.empty-icon { font-size: 3rem; margin-bottom: 15px; opacity: 0.5; }

@media (max-width: 600px) {
  .days-display { font-size: 2.5rem; }
  .nav-btn { padding: 8px 15px; font-size: 0.85rem; }
  .modal { padding: 25px; }
  .badge-grid { grid-template-columns: repeat(2, 1fr); }
  .user-card { padding: 35px 25px; margin: 20px; }
  .user-card h1 { font-size: 1.8rem; }
  .form-row { flex-direction: column; gap: 0; }
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="userScreen">
  <div class="user-card">
    <h1>✨ 宇宙级浪漫</h1>
    <p>每一颗星星，都是爱的证明</p>
    <div class="user-btns">
      <button class="user-btn boy" onclick="loginAs('boy')">🌟 我是他</button>
      <button class="user-btn girl" onclick="loginAs('girl')">💖 我是她</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="days-header">
    <div class="days-display" id="daysDisplay">0</div>
    <div class="days-label">天</div>
    <div class="anniversary-date" id="anniversaryDate"></div>
  </div>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="showSection('memories')">💭 回忆</button>
    <button class="nav-btn" onclick="showSection('letters')">💌 碎碎念</button>
    <button class="nav-btn" onclick="showSection('things')">✅ 打卡</button>
    <button class="nav-btn" onclick="showSection('badges')">🏆 徽章</button>
    <button class="nav-btn" onclick="showSection('settings')">⚙️ 设置</button>
  </div>

  <div class="content-section active" id="section-memories">
    <div class="bottom-actions" style="margin-bottom: 20px;">
      <button class="action-btn primary" onclick="openModal('memoryModal')">➕ 添加回忆</button>
    </div>
    <div id="memoriesList"></div>
  </div>

  <div class="content-section" id="section-letters">
    <div class="bottom-actions" style="margin-bottom: 20px;">
      <button class="action-btn primary" onclick="openModal('letterModal')">✉️ 写碎碎念</button>
    </div>
    <div id="lettersList"></div>
  </div>

  <div class="content-section" id="section-things">
    <div class="card stats-card">
      <div class="stats-number" id="completedCount">0/10</div>
      <div class="stats-label">已解锁的浪漫</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>
    <div id="thingsList"></div>
  </div>

  <div class="content-section" id="section-badges">
    <div class="card badge-card">
      <div class="card-title">🏆 解锁的浪漫成就</div>
      <div class="badge-grid" id="badgesGrid"></div>
    </div>
  </div>

  <div class="content-section" id="section-settings">
    <div class="card">
      <div class="setting-row">
        <span class="setting-label">📅 纪念日</span>
        <span class="setting-value" id="settingAnniversary" onclick="openModal('settingsModal')" style="cursor:pointer">未设置</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">👤 当前身份</span>
        <span class="setting-value" id="settingCurrentUser">-</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">☁️ 云端同步</span>
        <span class="setting-value" id="settingSyncStatus">已连接</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">💾 切换用户</span>
        <button class="action-btn" style="padding:6px 16px;font-size:0.85rem" onclick="switchUser()">切换</button>
      </div>
    </div>
  </div>

  <div class="bottom-actions" style="margin-top: 30px;">
    <button class="action-btn" onclick="exportData()">📤 导出数据</button>
    <button class="action-btn" onclick="showSection('settings')">⚙️ 设置</button>
  </div>
</div>

<div class="modal-overlay" id="memoryModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="memoryModalTitle">添加回忆</div>
      <button class="modal-close" onclick="hideModal('memoryModal')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">标题</label>
      <input type="text" class="form-input" id="memTitle" placeholder="给这个回忆起个名字">
    </div>
    <div class="form-group">
      <label class="form-label">内容</label>
      <textarea class="form-textarea" id="memText" placeholder="记录这一刻的浪漫..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">心动指数</label>
        <select class="form-select" id="memScore">
          <option value="1">⭐ 1分</option>
          <option value="2">⭐⭐ 2分</option>
          <option value="3">⭐⭐⭐ 3分</option>
          <option value="4" selected>⭐⭐⭐⭐ 4分</option>
          <option value="5">⭐⭐⭐⭐⭐ 5分</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">照片链接</label>
        <input type="text" class="form-input" id="memPhoto" placeholder="可选">
      </div>
    </div>
    <button class="btn-primary" onclick="saveMemory()">保存</button>
  </div>
</div>

<div class="modal-overlay" id="letterModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="letterModalTitle">写碎碎念</div>
      <button class="modal-close" onclick="hideModal('letterModal')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">想说的话</label>
      <textarea class="form-textarea" id="letterMsg" placeholder="今天想对你说什么..."></textarea>
    </div>
    <button class="btn-primary" onclick="saveLetter()">发送</button>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">设置纪念日</div>
      <button class="modal-close" onclick="hideModal('settingsModal')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">📅 纪念日</label>
      <input type="date" class="form-input" id="anniversaryDateInput">
    </div>
    <button class="btn-primary" onclick="saveSettings()">保存</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ========== Supabase 配置 ==========
const SUPABASE_URL = 'https://your-project.supabase.co';
const SUPABASE_ANON_KEY = 'your-anon-key';

let supabase;
let currentUser = null;
let editingMemoryId = null;

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', async () => {
  try {
    supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    initStars();
    initShootingStars();
    await checkAuth();
    toast('✨ 欢迎来到宇宙级浪漫');
  } catch (err) {
    console.error('Init error:', err);
    toast('⚠️ 初始化失败，使用本地存储模式');
    supabase = null;
    await initLocal();
  }
});

// ========== 认证 ==========
async function checkAuth() {
  if (!supabase) return;
  const { data: session } = await supabase.auth.getSession();
  if (session?.session) {
    currentUser = session.session.user.id;
    await initApp();
  }
}

function loginAs(role) {
  if (!supabase) {
    // 本地模式
    currentUser = role;
    initApp();
    return;
  }
  // Supabase 模式 - 简化处理
  const fakeUser = `${role}@local.app`;
  supabase.auth.signIn({ email: fakeUser }, { redirectTo: window.location.href })
    .then(async ({ error }) => {
      if (error) {
        // 创建或登录
        await supabase.auth.signUp({ email: fakeUser, password: 'password123' });
      }
      currentUser = fakeUser;
      initApp();
    });
}

async function switchUser() {
  if (supabase) await supabase.auth.signOut();
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('userScreen').style.display = 'flex';
}

// ========== 初始化应用 ==========
async function initApp() {
  document.getElementById('userScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  await loadData();
  updateDays();
  renderAll();
}

async function initLocal() {
  // 检查本地存储
  const savedUser = localStorage.getItem('currentUser');
  if (savedUser) {
    currentUser = savedUser;
    await initApp();
    return;
  }
  document.getElementById('userScreen').style.display = 'flex';
}

// ========== 数据操作 ==========
async function saveData(key, data) {
  if (supabase) {
    await supabase.from('app_data').upsert({
      user_id: currentUser,
      key: key,
      data: data,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,key' });
  } else {
    const all = JSON.parse(localStorage.getItem(currentUser) || '{}');
    all[key] = data;
    localStorage.setItem(currentUser, JSON.stringify(all));
  }
}

async function loadData() {
  if (!currentUser) return;
  if (supabase) {
    const { data } = await supabase.from('app_data').select('data').eq('user_id', currentUser);
    window.appData = {};
    if (data) data.forEach(d => { window.appData[d.key] = d.data; });
  } else {
    window.appData = JSON.parse(localStorage.getItem(currentUser) || '{}');
  }
}

// ========== 渲染 ==========
function renderAll() {
  renderMemories();
  renderLetters();
  renderThings();
  renderBadges();
  renderSettings();
}

function renderMemories() {
  const memories = window.appData['memories'] || [];
  const html = memories.map(m => `
    <div class="card memory-card">
      <button class="edit-btn" onclick="editMemory('${m.id}')">✏️</button>
      <button class="delete-btn" onclick="deleteMemory('${m.id}')">✕</button>
      <div class="memory-title">${escapeHtml(m.title)}</div>
      <div class="memory-text">${escapeHtml(m.text)}</div>
      ${m.photo ? `<img src="${m.photo}" class="memory-photo" onerror="this.style.display='none'">` : ''}
      <span class="memory-score ${m.score >= 4 ? 'high' : m.score >= 3 ? 'mid' : 'low'}">${'⭐'.repeat(m.score)}</span>
      <div class="memory-date">${m.date}</div>
    </div>
  `).join('');
  document.getElementById('memoriesList').innerHTML = html || `
    <div class="empty-state"><div class="empty-icon">💭</div>还没有回忆，去添加第一条吧！</div>`;
}

function renderLetters() {
  const letters = window.appData['letters'] || [];
  const html = letters.map(l => `
    <div class="card letter-card" style="border-left-color:${l.from === 'boy' ? '#4facfe' : '#ff6b9d'}">
      <button class="delete-btn" onclick="deleteLetter('${l.id}')">✕</button>
      <div class="letter-from">${l.from === 'boy' ? '🌟 他' : '💖 她'}</div>
      <div class="letter-msg">${escapeHtml(l.msg)}</div>
      <div class="letter-date">${l.date}</div>
    </div>
  `).join('');
  document.getElementById('lettersList').innerHTML = html || `
    <div class="empty-state"><div class="empty-icon">💌</div>还没有碎碎念，写下你的心意吧！</div>`;
}

function renderThings() {
  const things = window.appData['things'] || [];
  const html = things.map(t => `
    <div class="thing-card">
      <div class="thing-info">
        <div class="thing-name">${escapeHtml(t.name)}</div>
        <div class="thing-count">已打卡 ${t.count || 0} 次</div>
      </div>
      <button class="thing-toggle ${t.done ? 'done' : 'undone'}" onclick="toggleThing('${t.id}')"></button>
    </div>
  `).join('');
  document.getElementById('thingsList').innerHTML = html || `
    <div class="empty-state"><div class="empty-icon">✅</div>还没有打卡项，去添加吧！</div>`;

  const done = things.filter(t => t.done).length;
  document.getElementById('completedCount').textContent = `${done}/${things.length}`;
  document.getElementById('progressFill').style.width = `${(done / Math.max(things.length, 1)) * 100}%`;
}

function renderBadges() {
  const badges = window.appData['badges'] || [];
  const html = badges.map(b => `
    <div class="badge-item ${b.unlocked ? 'unlocked' : ''}">
      <div class="badge-icon">${b.icon}</div>
      <div class="badge-name">${escapeHtml(b.name)}</div>
    </div>
  `).join('');
  document.getElementById('badgesGrid').innerHTML = html || `
    <div class="empty-state"><div class="empty-icon">🏆</div>还没有徽章，去解锁吧！</div>`;
}

function renderSettings() {
  const anniv = window.appData['anniversary'] || '';
  document.getElementById('settingAnniversary').textContent = anniv || '未设置';
  document.getElementById('settingCurrentUser').textContent = currentUser === 'boy' ? '🌟 他' : '💖 她';
}

// ========== 天数计算 ==========
function updateDays() {
  const anniv = window.appData['anniversary'];
  if (!anniv) return;

  const days = Math.floor((Date.now() - new Date(anniv)) / (1000 * 60 * 60 * 24));
  document.getElementById('daysDisplay').textContent = days;
  document.getElementById('anniversaryDate').textContent = `纪念日：${anniv}`;
}

// ========== 回忆操作 ==========
function openModal(id) {
  document.getElementById(id).classList.add('show');
}

function hideModal(id) {
  document.getElementById(id).classList.remove('show');
}

function editMemory(id) {
  const memories = window.appData['memories'] || [];
  const m = memories.find(x => x.id === id);
  if (!m) return;

  editingMemoryId = id;
  document.getElementById('memoryModalTitle').textContent = '编辑回忆';
  document.getElementById('memTitle').value = m.title;
  document.getElementById('memText').value = m.text;
  document.getElementById('memScore').value = m.score;
  document.getElementById('memPhoto').value = m.photo || '';
  openModal('memoryModal');
}

async function saveMemory() {
  const title = document.getElementById('memTitle').value.trim();
  const text = document.getElementById('memText').value.trim();
  if (!title || !text) { toast('请填写完整'); return; }

  const memories = window.appData['memories'] || [];
  const score = parseInt(document.getElementById('memScore').value);
  const photo = document.getElementById('memPhoto').value.trim();
  const date = new Date().toLocaleDateString('zh-CN');

  if (editingMemoryId) {
    const idx = memories.findIndex(m => m.id === editingMemoryId);
    if (idx > -1) memories[idx] = { ...memories[idx], title, text, score, photo };
    editingMemoryId = null;
  } else {
    memories.push({ id: 'm_' + Date.now(), title, text, score, photo, date });
  }

  await saveData('memories', memories);
  hideModal('memoryModal');
  document.getElementById('memoryModalTitle').textContent = '添加回忆';
  document.getElementById('memTitle').value = '';
  document.getElementById('memText').value = '';
  document.getElementById('memPhoto').value = '';
  renderMemories();
  toast('回忆已保存 💕');
}

async function deleteMemory(id) {
  if (!confirm('删除这条回忆？')) return;
  const memories = (window.appData['memories'] || []).filter(m => m.id !== id);
  await saveData('memories', memories);
  renderMemories();
  toast('已删除');
}

// ========== 碎碎念操作 ==========
async function saveLetter() {
  const msg = document.getElementById('letterMsg').value.trim();
  if (!msg) { toast('请填写内容'); return; }

  const letters = window.appData['letters'] || [];
  const from = currentUser === 'boy' ? 'boy' : 'girl';
  letters.unshift({ id: 'l_' + Date.now(), from, msg, date: new Date().toLocaleDateString('zh-CN') });

  await saveData('letters', letters);
  hideModal('letterModal');
  document.getElementById('letterMsg').value = '';
  renderLetters();
  toast('已发送 💌');
}

async function deleteLetter(id) {
  if (!confirm('删除这条碎碎念？')) return;
  const letters = (window.appData['letters'] || []).filter(l => l.id !== id);
  await saveData('letters', letters);
  renderLetters();
  toast('已删除');
}

// ========== 打卡操作 ==========
async function toggleThing(id) {
  const things = window.appData['things'] || [];
  const t = things.find(x => x.id === id);
  if (!t) return;

  t.done = !t.done;
  if (t.done) t.count = (t.count || 0) + 1;

  await saveData('things', things);
  renderThings();
  updateBadges();
}

// ========== 徽章 ==========
async function updateBadges() {
  const things = window.appData['things'] || [];
  const memories = window.appData['memories'] || [];
  const letters = window.appData['letters'] || [];

  let badges = window.appData['badges'] || [];

  if (memories.length >= 10 && !badges.find(b => b.name === '回忆收集者')) {
    badges.push({ icon: '📚', name: '回忆收集者', unlocked: true });
  }
  if (letters.length >= 20 && !badges.find(b => b.name === '情书大师')) {
    badges.push({ icon: '💌', name: '情书大师', unlocked: true });
  }
  if (things.filter(t => t.done).length >= 5 && !badges.find(b => b.name === '行动派')) {
    badges.push({ icon: '⚡', name: '行动派', unlocked: true });
  }

  await saveData('badges', badges);
  renderBadges();
}

// ========== 设置 ==========
async function saveSettings() {
  const date = document.getElementById('anniversaryDateInput').value;
  await saveData('anniversary', date);
  hideModal('settingsModal');
  updateDays();
  renderSettings();
  toast('设置已保存 ✅');
}

// ========== 导出 ==========
function exportData() {
  const data = JSON.stringify(window.appData, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'our-love-universe.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出 📤');
}

// ========== 工具函数 ==========
function showSection(name) {
  document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
  document.getElementById(`section-${name}`).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ========== 星空动画 ==========
function initStars() {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        opacity: Math.random()
      });
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.opacity += (Math.random() - 0.5) * 0.1;
      if (s.opacity < 0) s.opacity = 0;
      if (s.opacity > 1) s.opacity = 1;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  resize();
  animate();
}

function initShootingStars() {
  setInterval(() => {
    const star = document.createElement('div');
    star.className = 'shooting-star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 3000);
  }, 3000);
}

// ========== 首次初始化数据 ==========
async function initLocal() {
  if (currentUser) {
    const existing = localStorage.getItem(currentUser);
    if (!existing) {
      // 初始化示例数据
      const sample = {
        things: [
          { id: 't1', name: '一起看星星', done: true, count: 5 },
          { id: 't2', name: '说晚安', done: true, count: 20 },
          { id: 't3', name: '牵手散步', done: false, count: 3 },
          { id: 't4', name: '拥抱', done: true, count: 10 },
          { id: 't5', name: '一起做饭', done: false, count: 2 }
        ],
        badges: [
          { icon: '🌟', name: '初心', unlocked: true },
          { icon: '💫', name: '甜蜜', unlocked: false },
          { icon: '💖', name: '深爱', unlocked: false }
        ]
      };
      await saveData('things', sample.things);
      await saveData('badges', sample.badges);
    }
    await initApp();
  }
}
