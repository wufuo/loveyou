<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>小兔与小熊的宇宙</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-icons/icon.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#fff5e6,#fffaf0);
  color:#333;line-height:1.6;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
}

#userScreen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(135deg,#ff6b6b,#ff8e8e);
  display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;
}
#userScreen h1{font-size:28px;color:#fff;margin-bottom:30px}
.userBtn{
  background:#fff;color:#ff6b6b;padding:18px 40px;border-radius:30px;
  font-size:18px;font-weight:bold;margin:10px;box-shadow:0 4px 15px rgba(0,0,0,.2);
  border:none;cursor:pointer;min-width:160px;
}
.userBtn:active{transform:scale(.95)}

.container{max-width:500px;margin:0 auto;padding:0 16px;padding-bottom:80px}
header{
  background:#fff;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05);
  display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;
}
header h1{font-size:18px;color:#ff6b6b}
header .switch{font-size:12px;color:#999;background:#f0f0f0;padding:5px 12px;border-radius:15px;cursor:pointer}

.stats{display:flex;justify-content:space-around;background:#fff;margin:16px 0;border-radius:16px;padding:20px 10px;box-shadow:0 4px 15px rgba(255,107,107,.1)}
.stat{text-align:center;flex:1}
.stat .num{font-size:24px;font-weight:bold;color:#ff6b6b}
.stat .label{font-size:10px;color:#999;margin-top:2px}

.btn{
  background:linear-gradient(135deg,#ff6b6b,#ff8e8e);color:#fff;
  padding:14px 24px;border-radius:30px;font-size:15px;font-weight:bold;
  display:inline-block;margin:5px;border:none;cursor:pointer;box-shadow:0 4px 15px rgba(255,107,107,.3);
}
.btn:active{transform:scale(.96)}
.btn-outline{background:#fff;color:#ff6b6b;border:2px solid #ff6b6b;padding:12px 20px;border-radius:30px;font-size:14px;font-weight:bold}
.btn-block{display:block;width:100%;margin:10px 0}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:8px;background:#f0f0f0;border:none;cursor:pointer;margin-right:5px}
.btn-sm:active{transform:scale(.95)}
.btn-sm.delete{background:#fff0f0;color:#ff4444}
.btn-sm.edit{background:#fff5e6;color:#ff9800}

.sec-title{font-size:17px;font-weight:bold;margin:20px 0 14px;padding-left:12px;border-left:4px solid #ff6b6b;display:flex;justify-content:space-between;align-items:center}
.sec-title .add-btn{font-size:12px;color:#ff6b6b;background:#fff5f5;padding:4px 10px;border-radius:10px;cursor:pointer;font-weight:normal}

.thing{
  background:#fff;border-radius:14px;padding:14px;margin:10px 0;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:all .3s;
}
.thing.done{background:#f0fff4;border:2px solid #7ed957}
.thing.done .name{text-decoration:line-through;color:#aaa}
.thing .name{font-size:14px;flex:1}
.thing .cat{font-size:10px;color:#ff6b6b;background:#fff5f5;padding:2px 8px;border-radius:10px;margin-right:8px}
.thing .check{width:26px;height:26px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:14px}
.thing.done .check{background:#7ed957;border-color:#7ed957;color:#fff}

.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:#fff;border-radius:14px;padding:16px 10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.badge .icon{font-size:32px;display:block;margin-bottom:6px}
.badge .name{font-size:12px;font-weight:bold}
.badge .desc{font-size:9px;color:#999;margin-top:2px}
.badge.locked .icon{filter:grayscale(1);opacity:.3}
.badge.unlocked{border:2px solid #7ed957;background:#f0fff4}

.mem{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.05);position:relative;overflow:hidden}
.mem .stars{color:#ffc107;font-size:14px;margin-bottom:6px}
.mem .text{font-size:13px;margin-bottom:6px}
.mem .author{font-size:11px;color:#999}
.mem .photo{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-bottom:8px;cursor:pointer}
.mem .actions{position:absolute;top:10px;right:10px;display:flex;gap:5px}

.letter{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);position:relative;margin:10px 0}
.letter .who{font-size:12px;font-weight:bold;margin-bottom:6px;display:flex;justify-content:space-between}
.letter .msg{font-size:13px;background:#fff5f5;padding:8px 12px;border-radius:10px}
.letter .actions{position:absolute;top:10px;right:10px;display:flex;gap:5px}

input,textarea{
  width:100%;padding:12px;border:2px solid #eee;border-radius:10px;
  font-size:14px;margin:6px 0;font-family:inherit;
}
input:focus,textarea:focus{outline:none;border-color:#ff6b6b}

.bottom-bar{
  position:fixed;bottom:0;left:0;width:100%;background:#fff;
  padding:12px 16px;display:flex;gap:8px;
  box-shadow:0 -2px 10px rgba(0,0,0,.05);z-index:100;
}
.bottom-bar button{flex:1;padding:14px;border-radius:12px;font-size:14px;font-weight:bold;border:none;cursor:pointer}
.bottom-bar .add-mem{background:#ff6b6b;color:#fff}
.bottom-bar .add-letter{background:#ff9800;color:#fff}

.modal{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:flex-end;
}
.modal.show{display:flex}
.modal-content{
  background:#fff;width:100%;max-height:80%;border-radius:20px 20px 0 0;
  padding:20px;overflow-y:auto;
}
.modal-content h3{font-size:18px;margin-bottom:16px}
.modal-content button{width:100%;padding:14px;margin:8px 0;border-radius:12px;font-size:15px;border:none;cursor:pointer}
.modal-content .save{background:#ff6b6b;color:#fff;font-weight:bold}
.modal-content .cancel{background:#eee}

.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:14px;z-index:999;opacity:0;transition:opacity .3s;
  pointer-events:none;max-width:90%;
}
.toast.show{opacity:1}

.stars-input{display:flex;justify-content:center;gap:8px;padding:10px 0;font-size:30px;cursor:pointer}
.stars-input .star{color:#ddd;transition:color .2s}
.stars-input .star.active{color:#ffc107}

.photo-upload{
  border:2px dashed #ddd;padding:20px;text-align:center;border-radius:10px;
  cursor:pointer;margin:10px 0;background:#fafafa;
}
.photo-upload:hover{border-color:#ff6b6b;background:#fff5f5}
.photo-preview{max-height:150px;border-radius:8px;margin-top:10px;display:block}

.anniversary-input{padding:12px;border:2px solid #eee;border-radius:10px;font-size:16px;text-align:center}

.photo-modal{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.9);z-index:300;justify-content:center;align-items:center;
}
.photo-modal img{max-width:90%;max-height:90%;border-radius:10px}

.sync-status{
  position:fixed;top:10px;left:50%;transform:translateX(-50%);
  background:#fff;padding:8px 16px;border-radius:20px;font-size:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);display:none;z-index:100;
}
.sync-status.show{display:block}
.sync-status.syncing{background:#fff3e0;color:#ff9800}
.sync-status.online{background:#f0fff4;color:#7ed957}

.config-tip{
  background:#fff3e0;padding:15px;border-radius:10px;margin:10px 0;
  font-size:12px;color:#e65100;display:none;
}
.config-tip.show{display:block}
.config-tip textarea{width:100%;margin-top:8px;font-size:11px;}
</style>
</head>
<body>

<!-- ===== 同步状态指示器 ===== -->
<div class="sync-status" id="syncStatus">🔄 同步中...</div>

<!-- ===== Supabase配置提示 ===== -->
<div class="config-tip show" id="configTip">
  <strong>⚠️ 需要配置Supabase</strong><br>
  请在下方粘贴你的Supabase配置信息：
  <textarea id="supabaseConfig" rows="4" placeholder='URL,anon_key（两个值用英文逗号分隔）'></textarea>
  <button class="btn" onclick="initSupabase()">🔧 初始化</button>
</div>

<!-- ===== 用户切换界面 ===== -->
<div id="userScreen">

  <p style="color:rgba(255,255,255,.8);margin-bottom:20px;font-size:14px">请选择身份进入</p>
  <button class="userBtn" onclick="loginAs('rabbit')">🐰 我是小兔</button>
  <button class="userBtn" onclick="loginAs('bear')">🐻 我是小熊</button>
  <p style="color:rgba(255,255,255,.6);margin-top:30px;font-size:12px">点击进入 → 数据自动保存并同步</p>
</div>

<!-- ===== 主界面 ===== -->
<div id="app" style="display:none">
  <header>
    <h1>我们的宇宙</h1>
    <div style="display:flex;gap:10px">
      <span class="switch" onclick="showSettings()">⚙️ 设置</span>
      <span class="switch" onclick="switchUser()">🔄 切换</span>
    </div>
  </header>

  <div class="container">
    <!-- 统计 -->
    <div class="stats">
      <div class="stat"><div class="num" id="days">0</div><div class="label">在一起天数</div></div>
      <div class="stat"><div class="num" id="doneCount">0</div><div class="label">完成小事</div></div>
      <div class="stat"><div class="num" id="badgeCount">0</div><div class="label">解锁徽章</div></div>
    </div>

    <!-- 快捷按钮 -->
    <div style="text-align:center">
      <button class="btn" onclick="randomPick()">🎁 抽个盲盒</button>
      <button class="btn-outline" onclick="goToThings()">📝 开始打卡</button>
    </div>

    <!-- 情侣100件小事 -->
    <div class="sec-title">
      📋 小兔的专属清单
      <span class="add-btn" onclick="toggleThings()">收起/展开</span>
    </div>
    <div id="thingsList"></div>

    <!-- 成就徽章 -->
    <div class="sec-title">🏅 我们的成就</div>
    <div class="badges" id="badgesList"></div>

    <!-- 回忆墙 -->
    <div class="sec-title">
      💬 回忆墙
      <span class="add-btn" onclick="showMemoryModal()">＋ 添加</span>
    </div>
    <div id="memoriesList"></div>

    <!-- 碎碎念 -->
    <div class="sec-title">
      💌 碎碎念
      <span class="add-btn" onclick="showLetterModal()">＋ 添加</span>
    </div>
    <div class="letters" id="lettersList"></div>
  </div>

  <!-- 底部添加按钮 -->
  <div class="bottom-bar">
    <button class="add-mem" onclick="showMemoryModal()">💬 回忆</button>
    <button class="add-letter" onclick="showLetterModal()">💌 碎碎念</button>
  </div>
</div>

<!-- ===== 添加/编辑回忆弹窗 ===== -->
<div class="modal" id="memoryModal">
  <div class="modal-content">
    <h3 id="memoryModalTitle">✨ 添加新回忆</h3>
    <input type="hidden" id="memId">
    <input type="text" id="memTitle" placeholder="标题">
    <textarea id="memText" placeholder="一句话评价" rows="3"></textarea>
    <div style="text-align:center">评分：</div>
    <div class="stars-input" id="starInput">
      <span class="star" data-v="1">★</span>
      <span class="star" data-v="2">★</span>
      <span class="star" data-v="3">★</span>
      <span class="star" data-v="4">★</span>
      <span class="star" data-v="5">★</span>
    </div>
    <input type="hidden" id="memScore" value="0">
    <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
      📷 点击上传照片
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewPhoto(event)">
    </div>
    <img id="photoPreview" class="photo-preview" style="display:none">
    <input type="hidden" id="memPhoto">
    <button class="save" onclick="saveMemory()">保存</button>
    <button class="cancel" onclick="hideModal('memoryModal')">取消</button>
  </div>
</div>

<!-- ===== 添加/编辑碎碎念弹窗 ===== -->
<div class="modal" id="letterModal">
  <div class="modal-content">
    <h3 id="letterModalTitle">💌 添加碎碎念</h3>
    <input type="hidden" id="letterId">
    <textarea id="letterMsg" placeholder="想说什么..." rows="4"></textarea>
    <button class="save" onclick="saveLetter()">保存</button>
    <button class="cancel" onclick="hideModal('letterModal')">取消</button>
  </div>
</div>

<!-- ===== 设置弹窗 ===== -->
<div class="modal settings-modal" id="settingsModal">
  <div class="modal-content">
    <h3>⚙️ 设置</h3>
    <label style="font-size:14px;display:block;margin-bottom:8px">在一起的起始日期：</label>
    <input type="date" id="anniversaryDate" class="anniversary-input">
    <button class="save" onclick="saveSettings()">保存设置</button>
    <button class="cancel" onclick="hideModal('settingsModal')">取消</button>
  </div>
</div>

<!-- ===== 图片预览弹窗 ===== -->
<div class="photo-modal" id="photoModal">
  <img id="photoModalImg">
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ===== Supabase SDK ===== -->

// ==================== Supabase初始化 ====================
function initSupabase() {
  const configText = document.getElementById('supabaseConfig').value.trim();
  const parts = configText.split(',');

  if (parts.length < 2) {
    toast('请粘贴 Supabase URL 和 anon_key');
    return;
  }

  supabaseUrl = parts[0].trim();
  supabaseAnonKey = parts[1].trim();

  if (!supabaseUrl || !supabaseAnonKey) {
    toast('配置格式不正确');
    return;
  }

  try {
    supabase = createClient(supabaseUrl, supabaseAnonKey);
    supabaseInitialized = true;

    document.getElementById('configTip').classList.remove('show');
    toast('✅ Supabase连接成功！');

    if (currentUser) {
      syncFromSupabase();
    }

    setupRealtimeListener();

  } catch (e) {
    console.error('Supabase初始化失败:', e);
    toast('❌ 配置错误');
  }
}

function setupRealtimeListener() {
  if (!supabaseInitialized || !currentUser) return;

  const channel = supabase
    .channel('universe_changes')
    .on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'universe',
      filter: `username=eq.${currentUser}`
    }, (payload) => {
      applyRemoteData(payload.new);
    })
    .subscribe();
}

function applyRemoteData(data) {
  if (!data) return;

  done = new Set(data.done || []);
  memories = data.memories || [];
  letters = data.letters || [];

  if (data.badges) {
    badges = JSON.parse(data.badges);
  }

  if (data.anniversary) {
    anniversaries[currentUser] = data.anniversary;
  }

  renderAll();
  updateDays();
}

// ==================== 数据同步 ====================
async function syncToSupabase() {
  if (!supabaseInitialized || !currentUser) return false;

  showSyncStatus('syncing');

  try {
    const data = {
      username: currentUser,
      done: Array.from(done),
      memories: memories,
      letters: letters,
      badges: JSON.stringify(badges),
      anniversary: anniversaries[currentUser] || '',
      lastSync: new Date().toISOString()
    };

    let { error } = await supabase
      .from('universe')
      .update(data)
      .eq('username', currentUser);

    if (error) {
      await supabase
        .from('universe')
        .insert([data]);
    }

    showSyncStatus('online');
    return true;

  } catch (e) {
    console.error('同步失败:', e);
    showSyncStatus('offline');
    return false;
  }
}

async function syncFromSupabase() {
  if (!supabaseInitialized || !currentUser) return false;

  showSyncStatus('syncing');

  try {
    const { data, error } = await supabase
      .from('universe')
      .select('*')
      .eq('username', currentUser)
      .single();

    if (data) {
      applyRemoteData(data);
      showSyncStatus('online');
      return true;
    } else if (!error) {
      const emptyData = {
        username: currentUser,
        done: [],
        memories: [],
        letters: [],
        badges: JSON.stringify(badges),
        anniversary: '',
        lastSync: new Date().toISOString()
      };
      await supabase.from('universe').insert([emptyData]);
    }
  } catch (e) {
    console.error('拉取数据失败:', e);
  }

  showSyncStatus('offline');
  return false;
}

function showSyncStatus(status) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status show';

  if (status === 'syncing') {
    el.textContent = '🔄 正在同步...';
    el.classList.add('syncing');
  } else if (status === 'online') {
    el.textContent = '✅ 已同步';
    el.classList.add('online');
    setTimeout(() => {
      el.classList.remove('show');
    }, 1500);
  } else {
    el.textContent = '⚠️ 离线模式';
    el.classList.remove('syncing', 'online');
  }
}

// ==================== 照片上传 ====================
async function uploadPhotoToStorage(base64Data) {
  if (!supabaseInitialized) return base64Data;

  try {
    const fileName = `photo-${Date.now()}.jpg`;
    const { error } = await supabase.storage
      .from('memories')
      .upload(`${currentUser}/${fileName}`, base64Data);

    if (error) throw error;

    const { data: urlData } = supabase.storage
      .from('memories')
      .getPublicUrl(`${currentUser}/${fileName}`);

    return urlData.publicUrl;
  } catch (e) {
    console.error('照片上传失败:', e);
    return base64Data;
  }
}

// ==================== 本地存储备用 ====================
function saveLocal() {
  if (!currentUser) return;
  const userData = {
    done: Array.from(done),
    memories: memories,
    letters: letters,
    badges: badges.map(b => [...b]),
    anniversary: anniversaries[currentUser] || ''
  };
  try {
    localStorage.setItem('universe_' + currentUser, JSON.stringify(userData));
  } catch (e) {
    console.warn('本地保存失败');
  }
}

function loadLocal() {
  if (!currentUser) return;
  try {
    const data = JSON.parse(localStorage.getItem('universe_' + currentUser));
    if (data) {
      done = new Set(data.done || []);
      memories = data.memories || [];
      letters = data.letters || [];
      badges = data.badges || badges;
      if (data.anniversary) {
        anniversaries[currentUser] = data.anniversary;
      }
    }
  } catch (e) {
    console.warn('本地加载失败');
  }
}

// ==================== 天数计算 ====================
function calculateDays() {
  if (!currentUser || !anniversaries[currentUser]) return 0;
  const startDate = new Date(anniversaries[currentUser]);
  const today = new Date();
  const diffTime = today - startDate;
  const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  return Math.max(0, days);
}

function updateDays() {
  document.getElementById('days').textContent = calculateDays();
}

// ==================== 用户登录 ====================
async function loginAs(user) {
  currentUser = user;
  done = new Set();
  memories = [];
  letters = [];
  anniversaries = {};

  if (supabaseInitialized) {
    await syncFromSupabase();
  } else {
    loadLocal();
  }

  document.getElementById('userScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  updateDays();
  renderAll();

  if (!supabaseInitialized) {
    document.getElementById('configTip').classList.add('show');
    toast('⚠️ 请先配置Supabase以启用云同步');
  }
}

function switchUser() {
  if (supabaseInitialized) {
    syncToSupabase();
  } else {
    saveLocal();
  }

  document.getElementById('app').style.display = 'none';
  document.getElementById('userScreen').style.display = 'flex';
  currentUser = null;
}

// ==================== 设置 ====================
function showSettings() {
  const currentAnniversary = anniversaries[currentUser] || '';
  document.getElementById('anniversaryDate').value = currentAnniversary;
  document.getElementById('settingsModal').classList.add('show');
}

async function saveSettings() {
  const date = document.getElementById('anniversaryDate').value;
  if (date) {
    anniversaries[currentUser] = date;
    updateDays();

    if (supabaseInitialized) {
      await syncToSupabase();
    } else {
      saveLocal();
    }

    toast('✅ 设置已保存');
  }
  hideModal('settingsModal');
}
